<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist App</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="header">
        <h1>Find your film</h1>
        <a href="./watchlist.html">My Watchlist</a>
    </div>

    <form action="submit" class="search-box" id="search-box">
        <i class="fa-solid fa-magnifying-glass icon"></i>
        <input type="text" name="search-movie" id="search-movie" placeholder="Blade Runner">
        <button class="btn search-movie-btn" id="search-movie-btn">Search</button>
    </form>

    <div class="placeholder" id="placeholder">
        <i class="fa-solid fa-film placeholder-icon"></i>
        <p>Start exploring</p>
    </div>

    <div class="main" id="main">
        <div class="movie-card">
        </div>

        <script src="index.js" type="module"></script>
</body>

</html>
